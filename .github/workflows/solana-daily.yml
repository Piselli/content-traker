name: Solana daily

on:
  schedule:
    # Primary + backups (GH cron is unreliable if only one slot)
    - cron: "10 0 * * *"
    - cron: "40 0 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Solana metrics + quiet news → solana-daily.json
        run: node scripts/solana-daily.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPIKE_PCT: "25"

      - name: Commit solana-daily.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Solana daily snapshot"
          file_pattern: public/solana-daily.json
