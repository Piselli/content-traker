name: Radar watch

on:
  schedule:
    # Every 4 hours — free GH compute, no Cursor tokens, laptop off OK
    - cron: "20 */4 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .radar-watch-state.json
          key: radar-watch-${{ github.run_id }}
          restore-keys: radar-watch-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Watch feeds → radar-data.json + ntfy if spike/pattern
        run: node scripts/radar-watch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit radar-data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: radar watch ingest"
          file_pattern: public/radar-data.json
