name: StonkFun revenue snapshots

on:
  # PAUSED 2026-08-19 — hourly stonkfun-revenue.json commits were triggering Vercel deploys.
  # Restore crons: "5 * * * *", "20 0 * * *", "50 23 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Snapshot StonkFun totals
        run: node scripts/stonkfun-daily.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit stonkfun-revenue.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: StonkFun revenue snapshot"
          file_pattern: public/stonkfun-revenue.json
